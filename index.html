<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>·</title>
<style>
  :root { --void:#07040f; --water:#7fd6ff; --glow:#b48cff; --text:#e6dcff; --muted:#8f84a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(ellipse at 50% 35%, #1d1035 0%, var(--void) 70%) fixed; color: var(--text);
         font-family: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 100vh; padding: 18px 16px 32px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  nav button { background: transparent; color: var(--muted); border: 1px solid #3a2a5c; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  nav button.on { color: var(--text); border-color: var(--glow); background: rgba(108,63,196,.25); box-shadow: 0 0 10px rgba(180,140,255,.3); }
  canvas { width: min(640px, 100%); width: min(640px, 100%, max(300px, 100dvh - 230px)); aspect-ratio: 1; display: block; border-radius: 6px; touch-action: none;
           clip-path: polygon(2% 1%,40% 0,62% 2%,98% 0,100% 35%,98% 70%,100% 99%,60% 100%,30% 98%,0 100%,1% 60%,0 25%); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  button.act { background: #1c1430; color: var(--text); border: 1px solid #4a3a72; border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer; min-width: 44px; }
  button.act:hover { border-color: var(--glow); box-shadow: 0 0 8px rgba(180,140,255,.35); }
  button.save { background: linear-gradient(180deg,#5b3aa8,#3b2378); border-color: #8f6be0; color: #f1eaff; }
  .pad { display: grid; grid-template-columns: repeat(3, 46px); gap: 4px; }
  .pad button { padding: 8px 0; }
  .hidden { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }
  body { min-height: 100dvh; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  button, .tile, nav button { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  @media (hover: none) {
    button.act:hover { border-color: #4a3a72; box-shadow: none; }
    button.save:hover { border-color: #8f6be0; }
    button:hover { box-shadow: none; }
    button:active, button.act:active { filter: brightness(1.35); }
  }
  @media (max-width: 560px) {
    body { padding: 12px 10px 28px; gap: 12px; }
    button.act { padding: 12px 16px; font-size: 15px; min-width: 52px; min-height: 48px; }
    .pad { grid-template-columns: repeat(3, 62px); gap: 6px; }
    .pad button { min-height: 58px; font-size: 22px; padding: 0; }
  }
  #saveSheet { position: fixed; inset: 0; z-index: 99; background: rgba(4,2,10,.88); display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 14px; padding: 20px; }
  #saveSheet img { max-width: min(92vw, 560px); max-height: 68dvh; border-radius: 8px; box-shadow: 0 0 24px rgba(180,140,255,.35);
                   -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
  #saveSheet p { margin: 0; font-size: 14px; color: #cfc2ee; text-align: center; }
  #saveSheet .btns { display: flex; gap: 8px; }
  #saveSheet button { background: #1c1430; color: #e6dcff; border: 1px solid #4a3a72; border-radius: 8px; padding: 12px 18px; font-size: 15px; }
</style>
</head>
<body>
<nav id="nav" style="display:none"></nav>
<canvas id="cv" width="640" height="640"></canvas>
<div class="row" id="ctrl"></div>
<div class="row"><button class="act save" onclick="save()">이미지로 저장</button></div>

<script>

const COARSE = matchMedia('(pointer: coarse)').matches;
function deliver(blob, name) {
  if (!COARSE) {
    const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return;
  }
  const url = URL.createObjectURL(blob), file = new File([blob], name, { type: 'image/png' });
  const box = document.createElement('div'); box.id = 'saveSheet';
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  box.innerHTML = '<img alt=""><p>이미지를 길게 눌러 저장하세요.</p><div class="btns">' +
    (canShare ? '<button data-k="share">공유 · 저장</button>' : '<button data-k="dl">내려받기</button>') + '<button data-k="x">닫기</button></div>';
  box.querySelector('img').src = url;
  box.addEventListener('click', e => {
    const k = e.target.dataset && e.target.dataset.k;
    if (k === 'share') navigator.share({ files: [file] }).catch(() => {});
    else if (k === 'dl') { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
    else if (k === 'x' || e.target === box) { box.remove(); URL.revokeObjectURL(url); }
  });
  document.body.appendChild(box);
}
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const SZ = 640, DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = SZ * DPR; cv.height = SZ * DPR; ctx.scale(DPR, DPR);
const WATER = '#7fd6ff', GLOW = '#b48cff';

const bgCanvas = document.createElement('canvas'); bgCanvas.width = SZ; bgCanvas.height = SZ;
(function () {
  const g = bgCanvas.getContext('2d'); let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const bg = g.createRadialGradient(SZ / 2, SZ * .4, 30, SZ / 2, SZ * .4, SZ * .8);
  bg.addColorStop(0, '#1d1035'); bg.addColorStop(1, '#07040f'); g.fillStyle = bg; g.fillRect(0, 0, SZ, SZ);
  for (let i = 0; i < 16; i++) {
    g.save(); g.translate(rnd() * SZ, rnd() * SZ); g.rotate(rnd() * 6.28); const w = 10 + rnd() * 40;
    g.fillStyle = 'rgba(43,29,72,.55)'; g.strokeStyle = 'rgba(58,42,92,.8)';
    g.beginPath(); g.moveTo(0, 0); g.lineTo(w, w * .2); g.lineTo(w * .8, w); g.lineTo(0, w * .7); g.closePath(); g.fill(); g.stroke(); g.restore();
  }
  g.strokeStyle = 'rgba(61,44,99,.6)'; g.lineWidth = 1;
  for (let i = 0; i < 6; i++) { g.beginPath(); const x = rnd() * SZ, y = rnd() * SZ; g.moveTo(x, y); g.lineTo(x + (rnd() - .5) * 120, y + (rnd() - .5) * 120); g.stroke(); }
})();
function drawBG() { ctx.drawImage(bgCanvas, 0, 0); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function stone(x, y, w, h, lit) {
  rr(x, y, w, h, 8); const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, '#3b3150'); g.addColorStop(.6, '#2a2238'); g.addColorStop(1, '#1d1729'); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = lit ? WATER : '#4a3c66'; ctx.lineWidth = lit ? 2.5 : 1.2; ctx.stroke();
}
function pt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * SZ, y: (e.clientY - r.top) / r.height * SZ }; }
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

const Twin = (() => {
  const A = [".....", "..##.", ".#...", ".#..#", "..#.#", "....."];
  const B = [".....", ".#..#", ".#...", ".#...", "#.#..", ".#..."];
  const R = 6, C = 5, CELL = 50, SA = [5,4], TA = [0,1], SB = [2,4], TB = [2,2];
  const LX = 40, RX = 640 - 40 - C * CELL, TY = 170;
  let a, b, ga, gb, solved;
  function reset() { a = SA.slice(); b = SB.slice(); ga = { r: a[0], c: a[1], t: 0 }; gb = { r: b[0], c: b[1], t: 0 }; solved = false; }
  function mv(g, p, dr, dc) { const r = p[0] + dr, c = p[1] + dc; return (r >= 0 && r < R && c >= 0 && c < C && g[r][c] !== '#') ? [r, c] : p; }
  function go(dr, dc) {
    if (solved) return;
    const pa = a.slice(), pb = b.slice(); a = mv(A, a, dr, dc); b = mv(B, b, dr, -dc);
    ga = { fr: pa, to: a, t0: performance.now(), delay: 0 }; gb = { fr: pb, to: b, t0: performance.now(), delay: 180 };
    if (a[0] === TA[0] && a[1] === TA[1] && b[0] === TB[0] && b[1] === TB[1]) solved = true;
  }
  function pos(g, now) {
    if (!g.to) return [g.r, g.c];
    const k = Math.max(0, Math.min(1, (now - g.t0 - g.delay) / 160));
    return [g.fr[0] + (g.to[0] - g.fr[0]) * ease(k), g.fr[1] + (g.to[1] - g.fr[1]) * ease(k)];
  }
  function board(g, X, target, ghost) {
    ctx.fillStyle = '#120b22'; ctx.strokeStyle = solved ? WATER : '#3c2b63'; ctx.lineWidth = 2; rr(X - 8, TY - 8, C * CELL + 16, R * CELL + 16, 10); ctx.fill(); ctx.stroke();
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const x = X + c * CELL, y = TY + r * CELL;
      if (g[r][c] === '#') stone(x + 2, y + 2, CELL - 4, CELL - 4, false);
      else { ctx.fillStyle = ghost ? 'rgba(40,60,110,.35)' : 'rgba(30,20,52,.6)'; ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2); }
    }
    const tx = X + target[1] * CELL + CELL / 2, ty = TY + target[0] * CELL + CELL / 2;
    ctx.beginPath(); ctx.arc(tx, ty, CELL * .32, 0, 7); ctx.strokeStyle = solved ? WATER : 'rgba(180,140,255,.8)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
  }
  function figure(X, p, ghost) {
    const x = X + p[1] * CELL + CELL / 2, y = TY + p[0] * CELL + CELL / 2;
    ctx.save(); if (ghost) ctx.globalAlpha = .7;
    const g = ctx.createRadialGradient(x, y - 6, 2, x, y, 18); g.addColorStop(0, ghost ? '#cfefff' : '#fff'); g.addColorStop(1, ghost ? '#3a78b8' : '#7a55d0');
    ctx.fillStyle = g; ctx.shadowColor = ghost ? WATER : GLOW; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(x, y - 7, 7, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 10, y + 15); ctx.quadraticCurveTo(x, y - 4, x + 10, y + 15); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function draw() {
    const now = performance.now(); drawBG();
    const mx = 320; ctx.strokeStyle = 'rgba(180,200,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(mx, TY - 30); ctx.lineTo(mx - 6, TY + R * CELL / 2); ctx.lineTo(mx + 4, TY + R * CELL + 30); ctx.stroke();
    board(A, LX, TA, false); board(B, RX, TB, true);
    figure(LX, pos(ga, now), false); figure(RX, pos(gb, now), true);
    if (solved) { ctx.fillStyle = 'rgba(127,214,255,.08)'; ctx.fillRect(0, 0, SZ, SZ); }
  }
  reset();
  const controls = () => {
    const pad = document.createElement('div'); pad.className = 'pad';
    const cells = ['', ['↑', -1, 0], '', ['←', 0, -1], '', ['→', 0, 1], '', ['↓', 1, 0], ''];
    cells.forEach(c => { if (!c) { pad.appendChild(document.createElement('span')); return; } pad.appendChild(btn(c[0], () => go(c[1], c[2]))); });
    return [pad, btn('↺', reset)];
  };
  const key = k => { const m = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k]; if (m) go(m[0], m[1]); };
  return { name: '거울', file: 'mirror', draw, controls, key };
})();

const PUZZLES = [Twin];
let cur = 0;
function btn(label, fn) { const b = document.createElement('button'); b.className = 'act'; b.textContent = label; b.onclick = fn; return b; }
function select(i) {
  if (PUZZLES[cur].leave) PUZZLES[cur].leave();
  cur = i;
  document.querySelectorAll('nav button').forEach((b, k) => b.classList.toggle('on', k === i));
  const ctrl = document.getElementById('ctrl'); ctrl.innerHTML = ''; PUZZLES[i].controls().forEach(el => ctrl.appendChild(el));
}
PUZZLES.forEach((p, i) => { const b = document.createElement('button'); b.textContent = p.name; b.onclick = () => select(i); document.getElementById('nav').appendChild(b); });
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); PUZZLES[cur].down && PUZZLES[cur].down(e); });
cv.addEventListener('pointermove', e => PUZZLES[cur].move && PUZZLES[cur].move(e));
cv.addEventListener('pointerup', e => PUZZLES[cur].up && PUZZLES[cur].up(e));
document.addEventListener('keydown', e => { if (PUZZLES[cur].key && e.key.startsWith('Arrow')) e.preventDefault(); PUZZLES[cur].key && PUZZLES[cur].key(e.key); });

(function () {
  let sx = null, sy = null;
  cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
  cv.addEventListener('pointerup', e => {
    if (sx === null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    const G = (typeof GAMES !== 'undefined' ? GAMES : PUZZLES)[cur]; if (!G.key || Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
    G.key(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp'));
  });
  cv.addEventListener('pointercancel', () => { sx = null; });
})();
function loop(t) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); PUZZLES[cur].draw(t); requestAnimationFrame(loop); }
function save() {
  cv.toBlob(blob => { deliver(blob, PUZZLES[cur].file + '.png'); }, 'image/png');
}
select(0); requestAnimationFrame(loop);
</script>
</body>
</html>
